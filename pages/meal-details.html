<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealFinder</title>
    <link href="../CSS/style.css" rel="stylesheet" />
    <link href="../CSS/responsive.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- header includes nav bar, side bar, banner -->
    <header>
      <!-- nav bar -->
      <nav class="navbar fixed-top custom-nav">
        <div class="container-fluid">
          <a class="navbar-brand" href="../index.html">
            <i class="fa-solid fa-house"></i>
            MEAL FINDER
          </a>
          <!-- toggle button on nav bar -->
          <button
            data-bs-theme="dark"
            class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#offcanvasNavbar"
            aria-controls="offcanvasNavbar"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <!-- side bar -->
          <div
            class="offcanvas offcanvas-end"
            tabindex="-1"
            id="offcanvasNavbar"
            aria-labelledby="offcanvasNavbarLabel"
          >
            <div class="offcanvas-header">
              <button
                type="button"
                class="btn-close-round"
                data-bs-dismiss="offcanvas"
                aria-label="Close"
              >
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
            <!-- sidebar list -->
            <div class="offcanvas-body">
              <ul
                id="sidebarCategoryList"
                class="navbar-nav justify-content-end flex-grow-1 pe-3"
              ></ul>
            </div>
          </div>
        </div>
      </nav>

      <!-- banner image and contents -->
      <section class="align-items-center">
        <div class="banner-img"></div>
        <!-- search bar -->
        <div class="search-txt">
          <form class="d-flex justify-content-center mt-3 search" role="search">
            <input
              class="form-control me-2 ps-4"
              type="search"
              placeholder="Search recipies here ..."
              aria-label="Search"
            />
            <button class="btn-search" type="submit">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>
          <h1 class="text-white d-flex justify-content-center">
            What are your favourite cuisines?
          </h1>
          <p class="text-white d-flex justify-content-center">
            PERSONALIZE YOUR EXPERIENCE
          </p>
        </div>
      </section>
    </header>

    <section class="meal-desc">
      <nav aria-label="breadcrumb" class="navbar custom-nav">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a href="../index.html"><i class="fa-solid fa-house"></i></a>
          </li>
          <li
            id="breadcrumbHeader"
            class="breadcrumb-item active"
            aria-current="page"
          ></li>
        </ol>
      </nav>
    </section>

    <section class="d-flex flex-column category-section">
      <h4 class="sub-head">MEAL DETAILS</h4>
      <div class="sub-head-underline"></div>
      <div class="row meal-details-card d-flex">
        <div class="meal-img col-md-5 col-sm-5 col-xs-5">
          <img
            src="../assets/images/bainganbharta.jpg"
            class="card-img"
            alt="..."
          />
        </div>
        <div class="col-md-7 col-sm-7 col-xs-7">
          <h4 id="breadcrumbHeader" class="desc-heading"></h4>
          <div class="sub-underline"></div>

          <div>
            <span class="item-head">CATEGORY:</span>
            <span id="mealCategory" class="item-value"></span>
          </div>
          <div>
            <span class="item-head">Source:</span>
            <span id="mealSource" class="truncate-text"></span>
          </div>
          <div class="item-tag-outer">
            <span class="item-head">Tags:</span>
            <span id="mealTag"> </span>
          </div>
          <div class="item-color-card">
            <span class="item-head">Ingredients</span>
            <ol id="mealIngredients" class="list-ord">
              <!-- <li class="list-ord-item">Aubergine</li>
              <li class="list-ord-item">Onion</li>
              <li class="list-ord-item">Tomatoes</li>
              <li class="list-ord-item">Garlic</li>
              <li class="list-ord-item">Green Chilli</li>
              <li class="list-ord-item">Red Chilli Powder</li>
              <li class="list-ord-item">Oil</li>
              <li class="list-ord-item">Coriander Leaves</li>
              <li class="list-ord-item">Salt</li> -->
            </ol>
          </div>
        </div>
        <div class="col-md-12 col-sm-12 col-xs-12">
          <span class="item-head">Measure:</span>
          <div class="item-card">
            <ul id="mealMesures" class="list-unord">
              <!-- <li class="list-unord-item">1 large</li>
              <li class="list-unord-item">1/2 cup</li>
              <li class="list-unord-item">1 cup</li>
              <li class="list-unord-item">6 cloves</li>
              <li class="list-unord-item">1/4 teaspoon</li>
              <li class="list-unord-item">1.5 tablespoon</li>
              <li class="list-unord-item">1 tablespoon chopped</li>
              <li class="list-unord-item">as required</li> -->
            </ul>
          </div>
        </div>
        <div class="col-md-12 col-sm-12 col-xs-12">
          <span class="item-head">Instructions:</span>
          <ol id="instructionsList" class="list-ins">
            <!-- <li class="list-ins-item">
              Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste
              ullam modi nam, sapiente soluta nobis totam ea magnam esse, est,
              deserunt illo repudiandae sint nisi
            </li> -->
          </ol>
        </div>
      </div>
    </section>

    <section class="d-flex flex-column category-section">
      <h4 class="sub-head">CATEGORIES</h4>
      <div class="sub-head-underline"></div>
      <div id="categortGrid" class="category-grid"></div>
    </section>
    <script src="../JS/meal-details.js"></script>
    <script src="../JS/index.js"></script>
  </body>
</html>
